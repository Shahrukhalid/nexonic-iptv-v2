<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | Nexonic IPTV v2</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--fg:#1b1f24;--mut:#57606a;--card:#f6f8fa;--bd:#d0d7de;--ac:#c0242f;--acfg:#fff;--link:#c0242f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9da7b3;--card:#161b22;--bd:#30363d;--ac:#ff6b75;--acfg:#0d1117;--link:#ff6b75}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--link)}a:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--bg);padding:8px;z-index:9}
.wrap{max-width:60rem;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--bd)}header.top .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-top:12px;padding-bottom:12px}
header.top strong{margin-right:auto}nav a{margin-right:14px;text-decoration:none}
.hero{padding:48px 0 24px}h1{font-size:clamp(1.8rem,5vw,2.75rem);line-height:1.15;margin:0 0 12px}
.lead{font-size:1.15rem;color:var(--mut);margin:0 0 20px}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--ac);color:var(--acfg);font-weight:600;text-decoration:none;margin:0 8px 8px 0}
.btn.alt{background:transparent;color:var(--link);border:1px solid var(--bd)}
h2{margin:40px 0 12px;font-size:1.5rem}h3{margin:0 0 6px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}.card p{margin:0;color:var(--mut)}
.notice{border-left:4px solid var(--ac);background:var(--card);padding:12px 16px;border-radius:6px;margin:16px 0}
pre{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow-x:auto;font-size:.9rem}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--bd)}
details{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:8px 0}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0}
ul.l{padding-left:1.2rem}ul.plain{list-style:none;padding:0;margin:0}ul.plain li{margin:6px 0}
footer{border-top:1px solid var(--bd);margin-top:48px;padding:24px 0 40px;color:var(--mut);font-size:.95rem}
</style>
</head>
<body>
<main id="main"><div class="wrap"><section class="hero"><h1>Page not found</h1>
<p class="lead">That page does not exist on the Nexonic IPTV v2 site.</p>
<p><a class="btn" href="https://shahrukhalid.github.io/nexonic-iptv-v2/">Go to the Nexonic IPTV v2 home page</a><a class="btn alt" href="https://github.com/Shahrukhalid/nexonic-iptv-v2">View on GitHub</a></p></section></div></main>
</body>
</html>
